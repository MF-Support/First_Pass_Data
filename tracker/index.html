<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Panel Tracker">
  <title>Panel Tracker</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --navy:    #000E57;
      --blue:    #0F3CFF;
      --tint:    #E7ECFF;
      --offwhite:#FFFEF5;
      --gray:    #ABA18B;
      --green:   #27AE60;
      --red:     #C0392B;
      --orange:  #E67E22;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: Arial, sans-serif; background: var(--offwhite); color: var(--navy); min-height: 100vh; display: flex; flex-direction: column; }

    header { background: var(--navy); color: white; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-family: Georgia, serif; font-size: 18px; }

    .view { display: none; flex-direction: column; flex: 1; padding: 16px; gap: 14px; overflow-y: auto; }
    .view.active { display: flex; }

    .card { background: white; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
    .card-title { font-family: Georgia, serif; font-size: 14px; color: var(--navy); font-weight: bold; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

    label { font-size: 12px; color: var(--gray); display: block; margin-bottom: 4px; margin-top: 10px; }
    label:first-of-type { margin-top: 0; }
    input, select { width: 100%; padding: 13px 14px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; background: var(--offwhite); color: var(--navy); appearance: none; -webkit-appearance: none; }
    input:focus, select:focus { outline: none; border-color: var(--blue); }
    input[readonly] { background: #f5f5f5; color: #666; }

    .btn { width: 100%; padding: 16px; font-size: 17px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; letter-spacing: 0.5px; transition: opacity 0.15s, transform 0.1s; }
    .btn:active { opacity: 0.85; transform: scale(0.98); }
    .btn-primary { background: var(--blue);  color: white; }
    .btn-navy    { background: var(--navy);  color: white; }
    .btn-green   { background: var(--green); color: white; }
    .btn-red     { background: var(--red);   color: white; }
    .btn-gray    { background: #e0e0e0;      color: #555;  }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-sm      { padding: 10px 14px; font-size: 14px; width: auto; }

    /* Stage pills */
    .stage-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .stage-pill { flex: 1; min-width: 70px; padding: 10px 6px; border-radius: 8px; text-align: center; font-size: 12px; font-weight: bold; background: #f0f0f0; color: #999; border: 2px solid transparent; }
    .stage-pill.done    { background: var(--tint); color: var(--navy); border-color: var(--blue); }
    .stage-pill.next    { background: var(--blue); color: white; border-color: var(--navy); }

    /* Stage badge on confirm card */
    .stage-badge { display: inline-block; background: var(--blue); color: white; border-radius: 20px; padding: 6px 18px; font-size: 15px; font-weight: bold; letter-spacing: 0.5px; margin-top: 4px; }
    .stage-badge.new-label { background: var(--orange); }

    /* Timer */
    .timer-display { text-align: center; font-size: 52px; font-family: Georgia, serif; color: var(--navy); font-weight: bold; letter-spacing: 2px; padding: 10px 0; }
    .timer-label { text-align: center; font-size: 12px; color: var(--gray); margin-bottom: 4px; }

    /* Info strip */
    .info-strip { display: flex; gap: 10px; }
    .info-item { flex: 1; background: var(--tint); border-radius: 8px; padding: 10px 12px; text-align: center; }
    .info-item .ilabel { font-size: 10px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; }
    .info-item .ivalue { font-size: 16px; font-weight: bold; color: var(--navy); margin-top: 2px; }

    /* Scanner */
    #scan-btn { width: 100%; padding: 28px; font-size: 22px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; background: var(--blue); color: white; letter-spacing: 0.5px; }
    #scan-btn:active { opacity: 0.8; }

    /* Tap-to-scan button overlay */
    #tap-to-scan { width: 100%; padding: 20px; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; background: var(--blue); color: white; margin-top: 12px; }

    /* Toast */
    #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--navy); color: white; padding: 12px 24px; border-radius: 24px; font-size: 14px; font-weight: bold; transition: transform 0.3s ease; z-index: 9999; white-space: nowrap; }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* Settings */
    #view-settings { justify-content: flex-start; }

    /* History */
    .history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .history-table th { background: var(--navy); color: white; padding: 8px 10px; text-align: left; font-size: 11px; text-transform: uppercase; }
    .history-table td { padding: 8px 10px; border-bottom: 1px solid #eee; }
    .history-table tr:nth-child(even) td { background: var(--tint); }

    .text-center { text-align: center; }
    .text-sm { font-size: 12px; color: var(--gray); }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
  </style>
</head>
<body>

<header>
  <h1>⚡ Panel Tracker</h1>
</header>

<!-- ══ SCAN VIEW (main) ══ -->
<div class="view active" id="view-scan">

  <!-- Scanner card -->
  <div class="card" id="scan-card">
    <div class="card-title">Scan Panel Label</div>
    <button id="scan-btn" onclick="openCamera()">📷 Scan QR Code</button>
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">
    <div id="qr-reader" style="display:none"></div>
    <div class="mt-8" style="display:flex;gap:8px">
      <input type="text" id="manual-code" placeholder="Enter code manually" style="text-transform:uppercase;flex:1" autocomplete="off">
      <button class="btn btn-navy btn-sm" onclick="loadByCode(document.getElementById('manual-code').value)">Go</button>
    </div>
  </div>

</div>

<!-- ══ CONFIRM VIEW ══ -->
<div class="view" id="view-confirm">

  <!-- Panel info -->
  <div class="card">
    <div class="info-strip">
      <div class="info-item"><div class="ilabel">Job #</div><div class="ivalue" id="cf-job">—</div></div>
      <div class="info-item"><div class="ilabel">Panel #</div><div class="ivalue" id="cf-panel">—</div></div>
    </div>
    <div style="margin-top:12px">
      <div class="stage-row" id="cf-stage-progress"></div>
    </div>
  </div>

  <!-- Stage + Worker -->
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <span style="font-size:13px;color:var(--gray);font-weight:bold;text-transform:uppercase;letter-spacing:0.5px">Next Stage</span>
      <span class="stage-badge" id="cf-stage-badge">Layout</span>
    </div>
    <label>Worker</label>
    <select id="cf-worker"></select>
    <label style="margin-top:10px">Or add new worker</label>
    <div style="display:flex;gap:8px">
      <input type="text" id="cf-new-worker" placeholder="First Last" autocomplete="off">
      <button class="btn btn-gray btn-sm" onclick="addNewWorker()">Add</button>
    </div>
    <div class="mt-16">
      <button class="btn btn-green" onclick="startStage()">▶ Start</button>
    </div>
    <div style="margin-top:10px">
      <button class="btn btn-gray" onclick="cancelConfirm()">← Back to Scanner</button>
    </div>
  </div>

</div>

<!-- ══ TIMER VIEW ══ -->
<div class="view" id="view-timer">
  <div class="card">
    <div class="info-strip">
      <div class="info-item"><div class="ilabel">Job #</div><div class="ivalue" id="tm-job">—</div></div>
      <div class="info-item"><div class="ilabel">Panel #</div><div class="ivalue" id="tm-panel">—</div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title text-center" id="tm-stage">Layout in Progress</div>
    <div class="timer-label" id="tm-worker">Worker</div>
    <div class="timer-display" id="timer-display">00:00:00</div>
    <div class="mt-16">
      <button class="btn btn-red" onclick="stopStage()">⬛ Stop &amp; Complete Stage</button>
    </div>
  </div>
</div>

<!-- ══ CURRENT JOB VIEW ══ -->
<div class="view" id="view-current">
  <div class="card" id="cj-empty" style="display:none">
    <div class="text-center text-sm" style="padding:30px;font-size:15px">No active job</div>
  </div>
  <div id="cj-job-card" style="display:none">
    <div class="card">
      <div class="info-strip">
        <div class="info-item"><div class="ilabel">Job #</div><div class="ivalue" id="cj-job">—</div></div>
        <div class="info-item"><div class="ilabel">Panel #</div><div class="ivalue" id="cj-panel">—</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title text-center" id="cj-stage">Stage in Progress</div>
      <div class="timer-label" id="cj-worker">—</div>
      <div class="timer-display" id="cj-timer-display">00:00:00</div>
      <div class="mt-16">
        <button class="btn btn-red" onclick="stopStage()">⬛ Stop &amp; Complete Stage</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ HISTORY VIEW ══ -->
<div class="view" id="view-history">
  <div class="card">
    <div class="card-title">Recent Scans</div>
    <div style="overflow-x:auto">
      <table class="history-table">
        <thead><tr><th>Job #</th><th>Panel #</th><th>Stage</th><th>Worker</th><th>Duration</th></tr></thead>
        <tbody id="history-rows"><tr><td colspan="5" class="text-center text-sm" style="padding:20px">No records yet</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ══ SETTINGS VIEW ══ -->
<div class="view" id="view-settings">
  <div class="card">
    <div class="card-title">Settings</div>
    <label>Default Worker (auto-selected after scan)</label>
    <select id="settings-worker">
      <option value="">— None —</option>
    </select>
    <div class="mt-16">
      <button class="btn btn-navy" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<!-- Bottom nav -->
<div style="background:var(--navy);display:flex;border-top:2px solid var(--blue);position:sticky;bottom:0">
  <button onclick="goScan()" style="flex:1;padding:14px;background:none;border:none;color:white;font-size:12px;cursor:pointer">🏠 Scan</button>
  <button onclick="goCurrentJob()" id="nav-current" style="flex:1;padding:14px;background:none;border:none;color:white;font-size:12px;cursor:pointer">⏱ Current</button>
  <button onclick="goHistory()" style="flex:1;padding:14px;background:none;border:none;color:white;font-size:12px;cursor:pointer">📋 History</button>
  <button onclick="showView('settings')" style="flex:1;padding:14px;background:none;border:none;color:white;font-size:12px;cursor:pointer">⚙ Settings</button>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL  = 'https://ptbhguthosenkffjhbry.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0YmhndXRob3NlbmtmZmpoYnJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MDkzNzAsImV4cCI6MjEwMDQ4NTM3MH0.y71yXWsIUjzFBqC4itzZ36w9ixw_QDej2RaBPh8MLPI';

const STAGES      = ['Layout', 'Wire', 'Final', 'Tech'];
const FINAL_STAGE = 'Tech';

const ALL_WORKERS = [
  { name: 'Amelia Soto',          techOnly: false },
  { name: 'Angelo Bloodworth',    techOnly: false },
  { name: 'Ashley Sending',       techOnly: false },
  { name: 'Brandon Price',        techOnly: true  },
  { name: 'Carlos Guerrero',      techOnly: true  },
  { name: 'Configuration Dept',   techOnly: false },
  { name: 'Corey Watkins',        techOnly: false },
  { name: 'Craig Webb',           techOnly: false },
  { name: 'David Fowler',         techOnly: true  },
  { name: 'Eric Samson',          techOnly: false },
  { name: 'Gary Kellogg',         techOnly: true  },
  { name: 'Ivey Mack',            techOnly: false },
  { name: 'Jonathan Brazzle',     techOnly: false },
  { name: 'Joshua Yates',         techOnly: false },
  { name: 'Linda Thatlor',        techOnly: false },
  { name: 'Loi Cronce',           techOnly: false },
  { name: 'Marites Peters',       techOnly: false },
  { name: 'Quan Phoc',            techOnly: false },
  { name: 'Renisha Grant',        techOnly: false },
  { name: 'Rory Gaston',          techOnly: false },
  { name: 'Sai Kai',              techOnly: false },
  { name: 'Sharon Allen',         techOnly: false },
  { name: 'Victoria Cotto',       techOnly: false },
  { name: 'Vinh Vu-dinh',         techOnly: false },
];

// ── State ──────────────────────────────────────────────────────────────────
let defWorker    = localStorage.getItem('defWorker') || '';
let currentPanel = null;   // loaded panel object
let currentStage = '';     // auto-detected next stage
let activeStarted= null;
let activeWorker = '';
let timerInterval= null;
const qrDecoder  = new Html5Qrcode('qr-reader');

// ── Supabase ───────────────────────────────────────────────────────────────
async function sbFetch(path, method = 'GET', body = null, extra = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers: {
      'apikey': SUPABASE_ANON,
      'Authorization': `Bearer ${SUPABASE_ANON}`,
      'Content-Type': 'application/json',
      'Prefer': method === 'POST' ? 'return=representation' : '',
      ...extra
    },
    body: body ? JSON.stringify(body) : null
  });
  if (!res.ok) throw new Error(await res.text());
  if (res.status === 204 || method === 'DELETE') return null;
  return res.json();
}

// ── Helpers ────────────────────────────────────────────────────────────────
function nextStageFor(scans) {
  for (const s of STAGES) {
    if (!scans.find(sc => sc.stage === s && sc.stopped_at)) return s;
  }
  return null;
}

function workersForStage(stageName) {
  const isTech = stageName === 'Tech';
  const extras = JSON.parse(localStorage.getItem('extraWorkers') || '[]');
  const base   = ALL_WORKERS.filter(w => isTech || !w.techOnly);
  return [...base, ...extras.map(n => ({ name: n, techOnly: false }))]
    .sort((a, b) => a.name.localeCompare(b.name));
}

function populateWorkerSelect(id, stageName) {
  const el = document.getElementById(id);
  if (!el) return;
  const list = stageName ? workersForStage(stageName) : ALL_WORKERS.slice().sort((a,b)=>a.name.localeCompare(b.name));
  el.innerHTML = '<option value="">— Select worker —</option>' +
    list.map(w => `<option value="${w.name}">${w.name}</option>`).join('');
  if (defWorker) el.value = defWorker;
}

// ── Views ──────────────────────────────────────────────────────────────────
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
}

function goScan() {
  showView('scan');
}

function goCurrentJob() {
  updateCurrentJobView();
  showView('current');
}

function updateCurrentJobView() {
  const hasJob = !!(currentPanel && currentPanel._activeScanId);
  document.getElementById('cj-empty').style.display    = hasJob ? 'none'  : 'block';
  document.getElementById('cj-job-card').style.display = hasJob ? 'block' : 'none';
  if (hasJob) {
    document.getElementById('cj-job').textContent   = currentPanel.job_number   || '—';
    document.getElementById('cj-panel').textContent = currentPanel.panel_number || '—';
    document.getElementById('cj-stage').textContent = `${currentStage} in Progress`;
    document.getElementById('cj-worker').textContent = activeWorker;
  }
}

async function goHistory() {
  showView('history');
  try {
    let rows;
    try {
      rows = await sbFetch('scans?select=panel_code,stage,worker_name,started_at,stopped_at,panels(job_number,panel_number)&order=started_at.desc&limit=50');
    } catch {
      rows = await sbFetch('scans?select=panel_code,stage,worker_name,started_at,stopped_at&order=started_at.desc&limit=50');
    }
    const tbody = document.getElementById('history-rows');
    if (!rows.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-sm" style="padding:20px">No records yet</td></tr>'; return; }
    tbody.innerHTML = rows.map(r => {
      let dur = '—';
      if (r.started_at && r.stopped_at) {
        const mins = Math.round((new Date(r.stopped_at) - new Date(r.started_at)) / 60000);
        dur = mins < 60 ? `${mins}m` : `${Math.floor(mins/60)}h ${mins%60}m`;
      } else if (r.started_at) { dur = '▶ active'; }
      const job   = r.panels?.job_number   || '—';
      const panel = r.panels?.panel_number || r.panel_code;
      return `<tr><td>${job}</td><td>${panel}</td><td>${r.stage}</td><td>${r.worker_name}</td><td>${dur}</td></tr>`;
    }).join('');
  } catch (e) { toast('Error loading history: ' + e.message); }
}

// ── Settings ───────────────────────────────────────────────────────────────
function saveSettings() {
  defWorker = document.getElementById('settings-worker').value;
  localStorage.setItem('defWorker', defWorker);
  toast('Settings saved');
  goScan();
}

// ── Scanner ────────────────────────────────────────────────────────────────
function openCamera() {
  const input = document.getElementById('camera-input');
  input.value = '';
  input.click();
}

// ── Load panel ─────────────────────────────────────────────────────────────
async function loadByCode(code) {
  if (!code) return;
  code = code.toUpperCase().trim();
  try {
    const panels = await sbFetch(`panels?panel_code=eq.${encodeURIComponent(code)}&select=*`);

    if (!panels.length) {
      // New panel — parse job/panel from QR and show confirm as Layout
      const parts = code.split('|');
      const job   = parts.length >= 2 ? parts[0] : '';
      const panel = parts.length >= 2 ? parts[1] : '';
      currentPanel = { panel_code: code, job_number: job, panel_number: panel, is_complete: false, scans: [], _isNew: true };
      currentStage = 'Layout';
      showConfirm();
      return;
    }

    const p = panels[0];
    if (p.is_complete) { toast('⛔ Panel complete — QR is void'); return; }

    const scans = await sbFetch(`scans?panel_code=eq.${encodeURIComponent(code)}&select=*&order=started_at`);
    p.scans = scans;

    const next = nextStageFor(scans);
    if (!next) { toast('⛔ Panel complete — QR is void'); return; }

    // Check if stage is currently in progress on another device
    if (scans.find(s => s.stage === next && !s.stopped_at)) {
      toast(`${next} already in progress`);
      return;
    }

    currentPanel = p;
    currentStage = next;
    showConfirm();
  } catch (e) {
    toast('Error: ' + e.message);
  }
}

// ── Confirm view ───────────────────────────────────────────────────────────
function showConfirm() {
  document.getElementById('cf-job').textContent   = currentPanel.job_number   || '—';
  document.getElementById('cf-panel').textContent = currentPanel.panel_number || '—';

  // Stage progress pills
  const scans = currentPanel.scans || [];
  document.getElementById('cf-stage-progress').innerHTML = STAGES.map(s => {
    const done = scans.find(sc => sc.stage === s && sc.stopped_at);
    const cls  = done ? 'done' : s === currentStage ? 'next' : '';
    return `<div class="stage-pill ${cls}">${done ? '✓ ' : ''}${s}</div>`;
  }).join('');

  // Stage badge
  const badge = document.getElementById('cf-stage-badge');
  badge.textContent = currentStage;
  badge.className = 'stage-badge' + (currentPanel._isNew ? ' new-label' : '');

  // Worker dropdown filtered by stage
  populateWorkerSelect('cf-worker', currentStage);

  showView('confirm');
}

function cancelConfirm() {
  currentPanel = null;
  currentStage = '';
  showView('scan');
}

async function addNewWorker() {
  const name = document.getElementById('cf-new-worker').value.trim();
  if (!name) return;
  const extras = JSON.parse(localStorage.getItem('extraWorkers') || '[]');
  if (!extras.includes(name)) { extras.push(name); localStorage.setItem('extraWorkers', JSON.stringify(extras)); }
  try { await sbFetch('workers', 'POST', { name, tech_only: false }); } catch { /* ok */ }
  populateWorkerSelect('cf-worker', currentStage);
  document.getElementById('cf-worker').value = name;
  document.getElementById('cf-new-worker').value = '';
  toast('Worker added: ' + name);
}

// ── Stage start / stop ─────────────────────────────────────────────────────
async function startStage() {
  const worker = document.getElementById('cf-worker').value;
  if (!worker) { toast('Select a worker'); return; }

  // Block line workers from starting if they already have an active scan
  const workerObj  = ALL_WORKERS.find(w => w.name === worker);
  const isTechWorker = workerObj && workerObj.techOnly;
  if (!isTechWorker) {
    try {
      const active = await sbFetch(`scans?worker_name=eq.${encodeURIComponent(worker)}&stopped_at=is.null&limit=1`);
      if (active.length > 0) {
        toast(`${worker} already has an active job — stop it first`);
        return;
      }
    } catch { /* allow start if check fails */ }
  }

  try {
    // Register new panel first if needed
    if (currentPanel._isNew) {
      await sbFetch('panels', 'POST', {
        panel_code:   currentPanel.panel_code,
        job_number:   currentPanel.job_number,
        panel_number: currentPanel.panel_number,
        is_complete:  false
      });
      currentPanel._isNew = false;
    }

    const now  = new Date().toISOString();
    const rows = await sbFetch('scans', 'POST', {
      panel_code:  currentPanel.panel_code,
      stage:       currentStage,
      worker_name: worker,
      started_at:  now
    });
    currentPanel._activeScanId = rows[0].id;
    activeWorker = worker;

    // Show timer
    document.getElementById('tm-job').textContent   = currentPanel.job_number;
    document.getElementById('tm-panel').textContent = currentPanel.panel_number;
    document.getElementById('tm-stage').textContent = `${currentStage} in Progress`;
    document.getElementById('tm-worker').textContent = worker;
    activeStarted = new Date(now);
    startTimer();
    updateCurrentJobView();
    showView('timer');
    toast('Started ' + currentStage);
  } catch (e) {
    toast('Error: ' + e.message);
  }
}

async function stopStage() {
  if (!currentPanel?._activeScanId) return;
  const now = new Date().toISOString();
  try {
    await sbFetch(`scans?id=eq.${currentPanel._activeScanId}`, 'PATCH',
      { stopped_at: now }, { Prefer: 'return=minimal' });

    if (currentStage === FINAL_STAGE) {
      await sbFetch(`panels?panel_code=eq.${encodeURIComponent(currentPanel.panel_code)}`, 'PATCH',
        { is_complete: true }, { Prefer: 'return=minimal' });
      toast('✅ Panel complete — QR is now void');
    } else {
      toast(`${currentStage} complete!`);
    }
    stopTimer();
    activeWorker  = '';
    currentPanel  = null;
    currentStage  = '';
    updateCurrentJobView();
    showView('scan');
  } catch (e) {
    toast('Error: ' + e.message);
  }
}

// ── Timer ──────────────────────────────────────────────────────────────────
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(tick, 1000);
  tick();
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  activeStarted = null;
  document.getElementById('timer-display').textContent = '00:00:00';
}
function tick() {
  if (!activeStarted) return;
  const s   = Math.floor((Date.now() - activeStarted.getTime()) / 1000);
  const str = `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  document.getElementById('timer-display').textContent    = str;
  document.getElementById('cj-timer-display').textContent = str;
}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Init ───────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  // Populate settings worker list
  const allSorted = ALL_WORKERS.slice().sort((a,b) => a.name.localeCompare(b.name));
  const sw = document.getElementById('settings-worker');
  sw.innerHTML = '<option value="">— None —</option>' +
    allSorted.map(w => `<option value="${w.name}">${w.name}</option>`).join('');
  if (defWorker) sw.value = defWorker;

  // Native camera file input handler
  document.getElementById('camera-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const decoded = await qrDecoder.scanFile(file, false);
      loadByCode(decoded.trim().toUpperCase());
    } catch {
      toast('No QR code found — try again');
    }
  });
});
</script>
