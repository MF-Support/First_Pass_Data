<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Panel Tracker">
  <title>Panel Tracker</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --navy:    #000E57;
      --blue:    #0F3CFF;
      --tint:    #E7ECFF;
      --offwhite:#FFFEF5;
      --gray:    #ABA18B;
      --green:   #27AE60;
      --red:     #C0392B;
      --orange:  #E67E22;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: Arial, sans-serif;
      background: var(--offwhite);
      color: var(--navy);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--navy);
      color: white;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-family: Georgia, serif; font-size: 18px; }
    header .station-badge {
      background: var(--blue);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .view { display: none; flex-direction: column; flex: 1; padding: 16px; gap: 14px; }
    .view.active { display: flex; }

    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .card-title {
      font-family: Georgia, serif;
      font-size: 14px;
      color: var(--navy);
      font-weight: bold;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    label { font-size: 12px; color: var(--gray); display: block; margin-bottom: 4px; margin-top: 10px; }
    label:first-of-type { margin-top: 0; }
    input, select {
      width: 100%;
      padding: 13px 14px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: var(--offwhite);
      color: var(--navy);
      appearance: none;
      -webkit-appearance: none;
    }
    input:focus, select:focus { outline: none; border-color: var(--blue); }

    .btn {
      width: 100%;
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { opacity: 0.85; transform: scale(0.98); }
    .btn-primary { background: var(--blue);  color: white; }
    .btn-navy    { background: var(--navy);  color: white; }
    .btn-green   { background: var(--green); color: white; }
    .btn-red     { background: var(--red);   color: white; }
    .btn-gray    { background: #e0e0e0;      color: #555;  }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-sm      { padding: 10px 14px; font-size: 14px; width: auto; }

    .stage-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .stage-pill {
      flex: 1; min-width: 70px; padding: 10px 6px;
      border-radius: 8px; text-align: center;
      font-size: 12px; font-weight: bold;
      background: #f0f0f0; color: #999;
      border: 2px solid transparent;
    }
    .stage-pill.done    { background: var(--tint); color: var(--navy); border-color: var(--blue); }
    .stage-pill.active  { background: var(--green); color: white; }
    .stage-pill.current { background: var(--blue); color: white; border-color: var(--navy); }

    .timer-display {
      text-align: center;
      font-size: 52px;
      font-family: Georgia, serif;
      color: var(--navy);
      font-weight: bold;
      letter-spacing: 2px;
      padding: 10px 0;
    }
    .timer-label { text-align: center; font-size: 12px; color: var(--gray); margin-bottom: 4px; }

    .info-strip { display: flex; gap: 10px; }
    .info-item {
      flex: 1; background: var(--tint);
      border-radius: 8px; padding: 10px 12px; text-align: center;
    }
    .info-item .label { font-size: 10px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; }
    .info-item .value { font-size: 16px; font-weight: bold; color: var(--navy); margin-top: 2px; }

    #scanner-container { width: 100%; border-radius: 10px; overflow: hidden; background: #000; }
    #scanner-container video { width: 100%; border-radius: 10px; }

    /* New panel badge — shown in register card */
    .new-panel-code {
      background: var(--tint);
      border: 2px solid var(--blue);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 17px;
      font-weight: bold;
      color: var(--navy);
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 4px;
    }

    #toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--navy); color: white;
      padding: 12px 24px; border-radius: 24px;
      font-size: 14px; font-weight: bold;
      transition: transform 0.3s ease;
      z-index: 9999; white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    #view-setup { justify-content: center; }
    .setup-logo { text-align: center; font-family: Georgia, serif; font-size: 26px; color: var(--navy); margin-bottom: 8px; }
    .setup-sub  { text-align: center; font-size: 13px; color: var(--gray); margin-bottom: 20px; }

    .history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .history-table th {
      background: var(--navy); color: white;
      padding: 8px 10px; text-align: left;
      font-size: 11px; text-transform: uppercase;
    }
    .history-table td { padding: 8px 10px; border-bottom: 1px solid #eee; }
    .history-table tr:nth-child(even) td { background: var(--tint); }

    .divider { height: 1px; background: #eee; margin: 4px 0; }
    .text-center { text-align: center; }
    .text-sm { font-size: 12px; color: var(--gray); }
    .mt-4 { margin-top: 4px; }
  </style>
</head>
<body>

<header>
  <h1>⚡ Panel Tracker</h1>
  <span class="station-badge" id="header-station">—</span>
</header>

<!-- ══ SETUP VIEW ══ -->
<div class="view active" id="view-setup">
  <div class="setup-logo">Panel Tracker</div>
  <div class="setup-sub">Configure this iPad's station before use</div>
  <div class="card">
    <div class="card-title">Station Setup</div>
    <label>This station's stage</label>
    <select id="setup-stage">
      <option value="">— Select stage —</option>
      <option value="Layout">Layout</option>
      <option value="Wire">Wire</option>
      <option value="Final">Final</option>
      <option value="Tech">Tech</option>
    </select>
    <label>Default worker (optional)</label>
    <select id="setup-worker">
      <option value="">— Select worker —</option>
    </select>
    <div style="margin-top:16px">
      <button class="btn btn-navy" onclick="saveSetup()">Save &amp; Continue</button>
    </div>
  </div>
</div>

<!-- ══ MAIN VIEW ══ -->
<div class="view" id="view-main">

  <!-- Panel info strip (shown once a panel is loaded) -->
  <div class="card" id="panel-info-card" style="display:none">
    <div class="info-strip">
      <div class="info-item"><div class="label">Job #</div><div class="value" id="pi-job">—</div></div>
      <div class="info-item"><div class="label">Panel #</div><div class="value" id="pi-panel">—</div></div>
      <div class="info-item"><div class="label">Code</div><div class="value" id="pi-code" style="font-size:11px;letter-spacing:1px">—</div></div>
    </div>
    <div style="margin-top:12px">
      <div class="stage-row" id="stage-progress"></div>
    </div>
  </div>

  <!-- Scan card — primary action on every station -->
  <div class="card" id="scan-card">
    <div class="card-title" id="scan-title">Scan Panel QR Code</div>
    <div id="scanner-container">
      <div id="qr-reader"></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:10px">
      <button class="btn btn-gray btn-sm" id="scan-cancel-btn" onclick="cancelScan()" style="flex:1;display:none">Cancel</button>
      <button class="btn btn-primary" onclick="startScanner()" id="scan-btn">📷 Open Camera</button>
    </div>
    <div class="divider" style="margin-top:14px"></div>
    <div class="mt-4">
      <label>Or enter code manually</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="manual-code" placeholder="CP-20250724-0001" style="text-transform:uppercase" autocomplete="off">
        <button class="btn btn-navy btn-sm" onclick="loadByCode(document.getElementById('manual-code').value)">Go</button>
      </div>
    </div>
  </div>

  <!-- Register new panel (Layout only — shown when scanned code is unknown) -->
  <div class="card" id="register-card" style="display:none">
    <div class="card-title">New Panel — Register Details</div>
    <div class="new-panel-code" id="register-code">—</div>
    <label>Job #</label>
    <input type="text" id="reg-job" placeholder="e.g. 24-1234" autocomplete="off">
    <label>Panel #</label>
    <input type="text" id="reg-panel" placeholder="e.g. 001" autocomplete="off">
    <label>Worker</label>
    <select id="reg-worker"></select>
    <div style="margin-top:16px;display:flex;gap:10px">
      <button class="btn btn-gray btn-sm" onclick="cancelRegister()" style="flex:1">Cancel</button>
      <button class="btn btn-green" onclick="registerAndStart()" style="flex:2">▶ Register &amp; Start</button>
    </div>
  </div>

  <!-- Worker selector (non-Layout stations after scan) -->
  <div class="card" id="worker-card" style="display:none">
    <div class="card-title">Who is working this stage?</div>
    <select id="scan-worker"></select>
    <label style="margin-top:10px">Or add new worker</label>
    <div style="display:flex;gap:8px">
      <input type="text" id="new-worker-name" placeholder="First Last" autocomplete="off">
      <button class="btn btn-gray btn-sm" onclick="addNewWorker()">Add</button>
    </div>
    <div style="margin-top:16px">
      <button class="btn btn-green" onclick="startStage()">▶ Start Stage</button>
    </div>
  </div>

  <!-- Active stage / timer -->
  <div class="card" id="timer-card" style="display:none">
    <div class="card-title text-center" id="timer-stage-label">Layout in Progress</div>
    <div class="timer-label" id="timer-worker-label">Worker</div>
    <div class="timer-display" id="timer-display">00:00:00</div>
    <div style="margin-top:16px">
      <button class="btn btn-red" onclick="stopStage()">⬛ Stop &amp; Complete Stage</button>
    </div>
  </div>

</div>

<!-- ══ HISTORY VIEW ══ -->
<div class="view" id="view-history">
  <div class="card">
    <div class="card-title">Recent Scans</div>
    <div id="history-body" style="overflow-x:auto">
      <table class="history-table">
        <thead>
          <tr><th>Job #</th><th>Panel #</th><th>Stage</th><th>Worker</th><th>Duration</th></tr>
        </thead>
        <tbody id="history-rows">
          <tr><td colspan="5" class="text-center text-sm" style="padding:20px">No records yet</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <button class="btn btn-gray" onclick="showView('main')">← Back</button>
</div>

<!-- Bottom nav -->
<div style="background:var(--navy);display:flex;border-top:2px solid var(--blue)">
  <button onclick="showView('main')" style="flex:1;padding:14px;background:none;border:none;color:white;font-size:12px;cursor:pointer">🏠 Scan</button>
  <button onclick="loadHistory()" style="flex:1;padding:14px;background:none;border:none;color:white;font-size:12px;cursor:pointer">📋 History</button>
  <button onclick="showView('setup')" style="flex:1;padding:14px;background:none;border:none;color:white;font-size:12px;cursor:pointer">⚙ Setup</button>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL  = 'https://ptbhguthosenkffjhbry.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0YmhndXRob3NlbmtmZmpoYnJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MDkzNzAsImV4cCI6MjEwMDQ4NTM3MH0.y71yXWsIUjzFBqC4itzZ36w9ixw_QDej2RaBPh8MLPI';

const STAGES      = ['Layout', 'Wire', 'Final', 'Tech'];
const FINAL_STAGE = 'Tech';

const ALL_WORKERS = [
  { name: 'Amelia Soto',          initials: 'AS', techOnly: false },
  { name: 'Loi Cronce',           initials: 'LC', techOnly: false },
  { name: 'Angelo Bloodworth',    initials: 'AB', techOnly: false },
  { name: 'Marites Peters',       initials: 'MP', techOnly: false },
  { name: 'Craig Webb',           initials: 'CW', techOnly: false },
  { name: 'Jonathan Brazzle',     initials: 'JB', techOnly: false },
  { name: 'Rory Gaston',          initials: 'RG', techOnly: false },
  { name: 'Gary Kellogg',         initials: 'GK', techOnly: true  },
  { name: 'Configuration Dept',   initials: 'CD', techOnly: false },
  { name: 'Corey Watkins',        initials: 'CO', techOnly: false },
  { name: 'Joshua Yates',         initials: 'JY', techOnly: false },
  { name: 'Sharon Allen',         initials: 'SA', techOnly: false },
  { name: 'Vinh Vu-dinh',         initials: 'VV', techOnly: false },
  { name: 'Quan Phoc',            initials: 'QP', techOnly: false },
  { name: 'Linda Thatlor',        initials: 'LT', techOnly: false },
  { name: 'Sai Kai',              initials: 'SK', techOnly: false },
  { name: 'Renisha Grant',        initials: 'RE', techOnly: false },
  { name: 'Carlos Guerrero',      initials: 'CG', techOnly: true  },
  { name: 'Brandon Price',        initials: 'BP', techOnly: true  },
  { name: 'David Fowler',         initials: 'DF', techOnly: true  },
  { name: 'Victoria Cotto',       initials: 'VC', techOnly: false },
  { name: 'Eric Samson',          initials: 'ES', techOnly: false },
  { name: 'Ivey Mack',            initials: 'IM', techOnly: false },
  { name: 'Ashley Sending',       initials: 'AH', techOnly: false },
];

// ── State ──────────────────────────────────────────────────────────────────
let station   = localStorage.getItem('station')  || '';
let defWorker = localStorage.getItem('defWorker') || '';
let currentPanel  = null;
let activeStarted = null;
let timerInterval = null;
let scanner       = null;
let pendingCode   = '';   // code scanned but not yet registered

// ── Supabase ───────────────────────────────────────────────────────────────
async function sbFetch(path, method = 'GET', body = null, extra = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers: {
      'apikey': SUPABASE_ANON,
      'Authorization': `Bearer ${SUPABASE_ANON}`,
      'Content-Type': 'application/json',
      'Prefer': method === 'POST' ? 'return=representation' : '',
      ...extra
    },
    body: body ? JSON.stringify(body) : null
  });
  if (!res.ok) throw new Error(await res.text());
  return method === 'DELETE' ? null : res.json();
}

// ── Workers ────────────────────────────────────────────────────────────────
function workersForStation(stationName) {
  const isTech = stationName === 'Tech';
  const extras = JSON.parse(localStorage.getItem('extraWorkers') || '[]');
  const base = ALL_WORKERS.filter(w => isTech || !w.techOnly);
  return [...base, ...extras.map(n => ({ name: n, techOnly: false }))]
    .sort((a, b) => a.name.localeCompare(b.name));
}

function populateWorkerSelects() {
  const list    = workersForStation(station);
  const allList = ALL_WORKERS.slice().sort((a,b) => a.name.localeCompare(b.name));
  [
    { id: 'setup-worker', workers: allList },
    { id: 'reg-worker',   workers: list    },
    { id: 'scan-worker',  workers: list    },
  ].forEach(({ id, workers: wList }) => {
    const el = document.getElementById(id);
    if (!el) return;
    const cur = el.value;
    el.innerHTML = '<option value="">— Select worker —</option>' +
      wList.map(w => `<option value="${w.name}">${w.name}</option>`).join('');
    if (id === 'setup-worker' && defWorker) el.value = defWorker;
    else if (cur) el.value = cur;
    // Pre-select default worker where applicable
    if ((id === 'reg-worker' || id === 'scan-worker') && defWorker) el.value = defWorker;
  });
}

async function addNewWorker() {
  const name = document.getElementById('new-worker-name').value.trim();
  if (!name) return;
  const extras = JSON.parse(localStorage.getItem('extraWorkers') || '[]');
  if (!extras.includes(name)) { extras.push(name); localStorage.setItem('extraWorkers', JSON.stringify(extras)); }
  try { await sbFetch('workers', 'POST', { name, tech_only: false }); } catch { /* ok */ }
  populateWorkerSelects();
  document.getElementById('scan-worker').value = name;
  document.getElementById('new-worker-name').value = '';
  toast('Worker added: ' + name);
}

// ── Setup ──────────────────────────────────────────────────────────────────
function saveSetup() {
  const s = document.getElementById('setup-stage').value;
  if (!s) { toast('Please select a stage'); return; }
  station   = s;
  defWorker = document.getElementById('setup-worker').value;
  localStorage.setItem('station', station);
  localStorage.setItem('defWorker', defWorker);
  document.getElementById('header-station').textContent = station;
  populateWorkerSelects();
  showView('main');
  initMainView();
  toast('Station set to ' + station);
}

// ── Views ──────────────────────────────────────────────────────────────────
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
}

function initMainView() {
  document.getElementById('header-station').textContent = station || '—';
  document.getElementById('scan-title').textContent = station === 'Layout'
    ? 'Scan Label on Panel' : 'Scan Panel QR Code';
  showCard('scan-card');
  hideCard('register-card');
  hideCard('worker-card');
  hideCard('timer-card');
  hideCard('panel-info-card');
  stopTimer();
  currentPanel = null;
  pendingCode  = '';
}

function hideCard(id) { document.getElementById(id).style.display = 'none'; }
function showCard(id) { document.getElementById(id).style.display = ''; }

// ── Scanner ────────────────────────────────────────────────────────────────
function startScanner() {
  if (scanner) return;
  document.getElementById('scan-btn').style.display = 'none';
  document.getElementById('scan-cancel-btn').style.display = '';
  scanner = new Html5Qrcode('qr-reader');
  scanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 240, height: 240 }, formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.DATA_MATRIX] },
    (decoded) => { stopScanner(); loadByCode(decoded.trim().toUpperCase()); },
    () => {}
  ).catch(err => { toast('Camera error: ' + err); stopScanner(); });
}

function stopScanner() {
  if (scanner) { scanner.stop().catch(() => {}); scanner.clear(); scanner = null; }
  document.getElementById('scan-btn').style.display = '';
  document.getElementById('scan-cancel-btn').style.display = 'none';
}

function cancelScan() { stopScanner(); }

// ── Load panel by code ─────────────────────────────────────────────────────
async function loadByCode(code) {
  if (!code) return;
  code = code.toUpperCase().trim();
  try {
    const panels = await sbFetch(`panels?panel_code=eq.${encodeURIComponent(code)}&select=*`);

    // ── Unknown code at Layout → register new panel ──
    if (!panels.length) {
      if (station !== 'Layout') {
        toast('Panel not found — must be registered at Layout first');
        return;
      }
      pendingCode = code;
      document.getElementById('register-code').textContent = code;

      // Parse QR format: JOB|PANEL|YYYYMMDD-RAND  → auto-fill fields
      const parts = code.split('|');
      document.getElementById('reg-job').value   = parts.length >= 2 ? parts[0] : '';
      document.getElementById('reg-panel').value = parts.length >= 2 ? parts[1] : '';

      hideCard('scan-card');
      showCard('register-card');
      return;
    }

    const p = panels[0];

    if (p.is_complete) { toast('⛔ This panel is complete — QR is void'); return; }

    const scans = await sbFetch(`scans?panel_code=eq.${encodeURIComponent(code)}&select=*&order=started_at`);
    p.scans = scans;

    // Check this stage not already done
    if (scans.find(s => s.stage === station && s.stopped_at)) {
      toast(`${station} already completed for this panel`);
      return;
    }

    // Enforce stage order
    const idx = STAGES.indexOf(station);
    if (idx > 0) {
      const prev = STAGES[idx - 1];
      if (!scans.find(s => s.stage === prev && s.stopped_at)) {
        toast(`${prev} must be completed first`);
        return;
      }
    }

    currentPanel = p;
    updatePanelInfo();
    hideCard('scan-card');

    if (station === 'Layout') {
      // Layout re-scanning an existing panel (e.g., restarted app mid-job)
      showCard('worker-card');
    } else {
      showCard('worker-card');
    }
  } catch (e) {
    toast('Error: ' + e.message);
  }
}

// ── Register new panel (Layout + unknown code) ─────────────────────────────
async function registerAndStart() {
  const job    = document.getElementById('reg-job').value.trim();
  const panel  = document.getElementById('reg-panel').value.trim();
  const worker = document.getElementById('reg-worker').value;
  if (!job || !panel) { toast('Enter Job # and Panel #'); return; }
  if (!worker)        { toast('Select a worker'); return; }

  try {
    await sbFetch('panels', 'POST', {
      panel_code:   pendingCode,
      job_number:   job,
      panel_number: panel,
      is_complete:  false
    });
    currentPanel = { panel_code: pendingCode, job_number: job, panel_number: panel, is_complete: false, scans: [] };
    hideCard('register-card');
    updatePanelInfo();
    // Start the Layout stage immediately with the selected worker
    await startStageWithWorker(worker);
  } catch (e) {
    toast('Error registering panel: ' + e.message);
  }
}

function cancelRegister() {
  pendingCode = '';
  hideCard('register-card');
  showCard('scan-card');
}

// ── Stage start / stop ─────────────────────────────────────────────────────
async function startStage() {
  const worker = (document.getElementById('scan-worker')?.value || defWorker || '').trim();
  if (!worker) { toast('Select a worker'); return; }
  await startStageWithWorker(worker);
}

async function startStageWithWorker(worker) {
  if (!currentPanel) { toast('No panel loaded'); return; }
  const now = new Date().toISOString();
  try {
    const rows = await sbFetch('scans', 'POST', {
      panel_code:  currentPanel.panel_code,
      stage:       station,
      worker_name: worker,
      started_at:  now
    });
    currentPanel._activeScanId = rows[0].id;
    hideCard('worker-card');
    hideCard('scan-card');
    showCard('timer-card');
    document.getElementById('timer-stage-label').textContent = `${station} in Progress`;
    document.getElementById('timer-worker-label').textContent = worker;
    activeStarted = new Date(now);
    startTimer();
    toast('Started ' + station);
  } catch (e) {
    toast('Error: ' + e.message);
  }
}

async function stopStage() {
  if (!currentPanel?._activeScanId) return;
  const now = new Date().toISOString();
  try {
    await sbFetch(`scans?id=eq.${currentPanel._activeScanId}`, 'PATCH',
      { stopped_at: now }, { Prefer: 'return=minimal' });

    if (station === FINAL_STAGE) {
      await sbFetch(`panels?panel_code=eq.${encodeURIComponent(currentPanel.panel_code)}`, 'PATCH',
        { is_complete: true }, { Prefer: 'return=minimal' });
      toast('✅ Panel complete — QR is now void');
    } else {
      toast('Stage complete!');
    }
    stopTimer();
    initMainView();
  } catch (e) {
    toast('Error: ' + e.message);
  }
}

// ── Timer ──────────────────────────────────────────────────────────────────
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimerDisplay, 1000);
  updateTimerDisplay();
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  activeStarted = null;
  document.getElementById('timer-display').textContent = '00:00:00';
}
function updateTimerDisplay() {
  if (!activeStarted) return;
  const s = Math.floor((Date.now() - activeStarted.getTime()) / 1000);
  document.getElementById('timer-display').textContent =
    `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

// ── Panel info display ─────────────────────────────────────────────────────
function updatePanelInfo() {
  if (!currentPanel) return;
  document.getElementById('pi-job').textContent   = currentPanel.job_number;
  document.getElementById('pi-panel').textContent = currentPanel.panel_number;
  document.getElementById('pi-code').textContent  = currentPanel.panel_code;
  const scans = currentPanel.scans || [];
  document.getElementById('stage-progress').innerHTML = STAGES.map(s => {
    const done   = scans.find(sc => sc.stage === s && sc.stopped_at);
    const active = scans.find(sc => sc.stage === s && !sc.stopped_at);
    const cls  = done ? 'done' : active ? 'active' : s === station ? 'current' : '';
    const icon = done ? '✓ ' : active ? '▶ ' : '';
    return `<div class="stage-pill ${cls}">${icon}${s}</div>`;
  }).join('');
  showCard('panel-info-card');
}

// ── History ────────────────────────────────────────────────────────────────
async function loadHistory() {
  showView('history');
  try {
    let rows;
    try {
      rows = await sbFetch(
        'scans?select=panel_code,stage,worker_name,started_at,stopped_at,panels(job_number,panel_number)&order=started_at.desc&limit=50'
      );
    } catch {
      rows = await sbFetch(
        'scans?select=panel_code,stage,worker_name,started_at,stopped_at&order=started_at.desc&limit=50'
      );
    }
    const tbody = document.getElementById('history-rows');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center text-sm" style="padding:20px">No records yet</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(r => {
      let dur = '—';
      if (r.started_at && r.stopped_at) {
        const mins = Math.round((new Date(r.stopped_at) - new Date(r.started_at)) / 60000);
        dur = mins < 60 ? `${mins}m` : `${Math.floor(mins/60)}h ${mins%60}m`;
      } else if (r.started_at) { dur = '▶ active'; }
      const job   = r.panels?.job_number   || '—';
      const panel = r.panels?.panel_number || r.panel_code;
      return `<tr>
        <td>${job}</td><td>${panel}</td><td>${r.stage}</td>
        <td>${r.worker_name}</td><td>${dur}</td>
      </tr>`;
    }).join('');
  } catch (e) { toast('Error loading history: ' + e.message); }
}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Init ───────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  populateWorkerSelects();
  document.getElementById('setup-stage').value = station;
  document.getElementById('header-station').textContent = station || '—';
  if (station) { showView('main'); initMainView(); }
  else          { showView('setup'); }
});
</script>
